workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor for iOS
        script: |
          npx cap sync ios
      - name: Build iOS app (Xcode Archive & IPA)
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No se encontró ningún archivo .xcworkspace"
            exit 1
          fi
          
          echo "Usando workspace en: $WORKSPACE"
          
          # 1. Generar el archivo .xcarchive con xcodebuild
          xcodebuild -workspace "$WORKSPACE" -scheme "App" -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath $HOME/app.xcarchive
          
          # 2. Empaquetar el binario resultante directamente en un archivo .ipa válido
          mkdir -p $HOME/export/Payload
          cp -r $HOME/app.xcarchive.xcarchive/Products/Applications/App.app $HOME/export/Payload/
          cd $HOME/export
          zip -r RabinoVirtual.ipa Payload
          echo "IPA generado exitosamente en $HOME/export/RabinoVirtual.ipa"
    artifacts:
      - $HOME/export/**/*.ipa
      - $HOME/app.xcarchive/**/*.ipa
      - ios/**/*.ipa