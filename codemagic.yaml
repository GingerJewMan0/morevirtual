workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor for iOS
        script: |
          npx cap sync ios
      - name: Build iOS app (Xcode Archive)
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No se encontró ningun archivo .xcworkspace"
            exit 1
          fi
          
          WORKSPACE_DIR=$(dirname "$WORKSPACE")
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Usando workspace en: $WORKSPACE"
          echo "Usando esquema: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath $HOME/app.xcarchive
    artifacts:
      - $HOME/app.xcarchive/**/*.ipa
      - ios/**/*.ipa