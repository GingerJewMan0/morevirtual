workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor for iOS
        script: |
          npx cap sync ios
      - name: Build iOS app (Xcode Archive)
        script: |
          cd ios
          # Buscamos automáticamente el archivo .xcworkspace disponible
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Usando workspace: $WORKSPACE y esquema: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath $HOME/app.xcarchive
    artifacts:
      - $HOME/app.xcarchive/**/*.ipa
      - ios/**/*.ipa