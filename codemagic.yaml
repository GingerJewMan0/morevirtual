workflows:
  ios-workflow:
    name: iOS Build Workflow
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor for iOS
        script: |
          npx cap sync ios
      - name: Build iOS app (Xcode Archive)
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No se encontró ningún archivo .xcworkspace"
            exit 1
          fi
          
          echo "Usando workspace en: $WORKSPACE"
          
          # Compilamos el archivo .xcarchive
          xcodebuild -workspace "$WORKSPACE" -scheme "App" -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath $HOME/app.xcarchive
          
          # Exportamos el archivo .ipa directamente desde el archive generado
          xcodebuild -exportArchive -archivePath $HOME/app.xcarchive.xcarchive -exportPath $HOME/export -exportOptionsPlist exportOptions.plist || true
    artifacts:
      - $HOME/app.xcarchive/**/*.ipa
      - $HOME/export/**/*.ipa
      - ios/**/*.ipa