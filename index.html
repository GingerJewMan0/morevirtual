    <script>
      (function() {
        // Prevent Vite HMR WebSocket connection errors in sandbox iframe environment
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isHmr = protocols === 'vite-hmr' || urlStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('token=') !== -1;
            if (isHmr) {
              var listeners = {};
              var dummyWs = {
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: urlStr,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(evt, handler) {
                  if (!listeners[evt]) listeners[evt] = [];
                  listeners[evt].push(handler);
                  if (evt === 'open') {
                    setTimeout(function() {
                      if (typeof dummyWs.onopen === 'function') dummyWs.onopen({ type: 'open' });
                      handler({ type: 'open' });
                    }, 0);
                  }
                },
                removeEventListener: function(evt, handler) {
                  if (listeners[evt]) {
                    listeners[evt] = listeners[evt].filter(function(h) { return h !== handler; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  dummyWs.readyState = 3;
                }
              };
              return dummyWs;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String(event.reason || '');
          if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('vite-hmr') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
