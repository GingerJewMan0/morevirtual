name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # Esto le pide a GitHub que use una Mac virtual gratuita

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor
      npx cap sync ios

    # Aquí puedes añadir los pasos de compilación con Xcode en la nube